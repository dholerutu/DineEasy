<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>DineEasy | My Order</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="CSS/order.css" />
  </head>
  <body>
    <header class="simple-header">
      <a href="Menu.html">← Continue ordering</a><b>DineEasy</b
      ><span>Table <strong id="table">12</strong></span>
    </header>
    <main class="order-wrap">
      <div>
        <p class="eyebrow">YOUR TABLE ORDER</p>
        <h1>Your order</h1>
        <div id="cartList" class="order-surface"></div>
        <section>
          <p class="eyebrow mt-5">YOU MAY ALSO LIKE</p>
          <h2>Complete your meal</h2>
          <div id="recommendations" class="recommend-grid"></div>
        </section>
      </div>
      <aside class="bill">
        <h3>Bill details</h3>
        <div><span>Item total</span><b id="sub">₹0</b></div>
        <div><span>GST & charges (5%)</span><b id="tax">₹0</b></div>
        <hr />
        <strong><span>Total</span><b id="total">₹0</b></strong
        ><button id="placeOrder" class="pay-btn">
          Place order & get token →</button
        ><small>Your order is sent directly to the kitchen.</small>
      </aside>
    </main>
    <script src="JS/order.js"></script>
    <script src="JS/order-session.js"></script>
  </body>
</html>
