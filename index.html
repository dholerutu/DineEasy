<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DineEasy | Smart Ordering</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Poppins:wght@300;400;500&display=swap"
        rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="CSS/Style.css">

</head>

<body>

    <!-- Decorative Leaves -->

    <img src="Images/leaf-top.png" class="leaf-top" alt="">
    <img src="Images/leaf-bottom.png" class="leaf-bottom" alt="">


    <section class="welcome-section">

                    <div class="welcome-card">

                        <!-- Premium Header -->

                        <div class="text-center">

                            <img src="Images/brand-logo.png"
                            alt="DineEasy Logo"
                            class="brand-logo">

                            <h1 class="brand">

                                DineEasy

                            </h1>

                            <p class="tagline">

                                SMART ORDERING. HAPPY DINING.

                            </p>

                            <div class="leaf-divider">

                                <span></span>

                                <i class="bi bi-flower3"></i>

                                <span></span>

                            </div>

                        </div>

                        <!-- Heading -->

                        <h2 class="text-center">

                            Welcome to Our Restaurant

                        </h2>

                        <div class="leaf-divider">

                            <span></span>

                            <i class="bi bi-flower3"></i>

                            <span></span>

                        </div>

                        <!-- Description -->

                        <p class="description text-center">

                            Skip the wait and enjoy a seamless dining experience.
                            Browse our digital menu, place your order 
                            and relax while we prepare it for you!!!

                        </p>

                        <!-- Restaurant Image -->

                        <div class="image-wrapper">

                            <img src="Images/restaurant.png"
                                class="img-fluid restaurant-img"
                                alt="Restaurant">

                        </div>

                                                <!-- Small Decorative Leaf -->

                        <div class="small-leaf">
                            <i class="bi bi-flower3"></i>
                        </div>

                        <!-- Button -->

                        <div class="text-center">

                            <button class="start-btn"
                                onclick="startOrder()">

                                Get Started
                                <i class="bi bi-arrow-right-short"></i>

                            </button>

                        </div>

                        <!-- Scan Order Enjoy -->

                        <div class="steps">

                            <div class="step">

                                <div class="step-icon">

                                    <i class="bi bi-qr-code-scan"></i>

                                </div>

                                <p>SCAN</p>


                            </div> <div class="step">

                                <div class="step-icon">

                                    <i class="bi bi-bag-check-fill"></i>

                                </div>

                                <p>ORDER</p>

                            </div>

                            <div class="step">

                                <div class="step-icon">

                                    <i class="bi bi-heart-fill"></i>

                                </div>

                                <p>ENJOY</p>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </section>

    <!-- Bootstrap JS -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JavaScript -->

    <script src="JS/script.js"></script>

</body>

</html>
